name = "life-os-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Non-secret vars. Secrets (GOOGLE_CLIENT_SECRET, SUPABASE_SERVICE_ROLE_KEY,
# JWT_SECRET, TELEGRAM_BOT_TOKEN, ...) are set via `wrangler secret put` and
# locally via apps/api/.dev.vars (gitignored).
[vars]
FRONTEND_ORIGIN = "https://life-os-5qd.pages.dev"

# Access-token cache + transient OAuth state. Create with:
#   wrangler kv namespace create TOKENS
# then paste the returned id below.
[[kv_namespaces]]
binding = "TOKENS"
id = "4a74d2527203487fbca725ce83b0a159"

# Cron triggers (UTC; the handler gates by Europe/Warsaw hour where needed).
# Free plan: max 5 cron triggers per account — 4 used, 1 spare.
#   0 6 / 0 7 -> maintenance reminders + job-search fetch (08:00 Warsaw, DST-aware)
#   0 8       -> subscription reminders
#   */15      -> Shelly devices (snapshot, alerts, cloud-history backfill)
# Secrets not listed here are set via `wrangler secret put` and locally in .dev.vars.
# GEMINI_API_KEY — Google AI Studio key (https://aistudio.google.com/app/apikey)
#   Required for /api/meal-plan and /api/wardrobe/suggestion endpoints.
#   To set in production: npx wrangler secret put GEMINI_API_KEY
# SHELLY_AUTH_KEY / SHELLY_SERVER_URI — Shelly app → User settings → Authorization cloud key.
# SHELLY_WEBHOOK_SECRET (optional) — random string; enables /hooks/shelly/<secret>.

[triggers]
crons = ["0 6 * * *", "0 7 * * *", "0 8 * * *", "*/15 * * * *"]
