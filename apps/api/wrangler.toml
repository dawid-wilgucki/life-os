name = "life-os-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Non-secret vars. Secrets (GOOGLE_CLIENT_SECRET, SUPABASE_SERVICE_ROLE_KEY,
# JWT_SECRET, TELEGRAM_BOT_TOKEN, ...) are set via `wrangler secret put` and
# locally via apps/api/.dev.vars (gitignored).
[vars]
FRONTEND_ORIGIN = "http://localhost:4200"

# Access-token cache + transient OAuth state. Create with:
#   wrangler kv namespace create TOKENS
# then paste the returned id below.
[[kv_namespaces]]
binding = "TOKENS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Daily reminders. Cloudflare crons are UTC; the handler computes the real
# Europe/Warsaw hour to honour the 21:00 habit nudge across DST.
[triggers]
crons = ["0 6 * * *", "0 19 * * *", "0 20 * * *"]
