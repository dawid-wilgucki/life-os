name = "life-os-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Non-secret vars. Secrets (GOOGLE_CLIENT_SECRET, SUPABASE_SERVICE_ROLE_KEY,
# JWT_SECRET, TELEGRAM_BOT_TOKEN, ...) are set via `wrangler secret put` and
# locally via apps/api/.dev.vars (gitignored).
[vars]
FRONTEND_ORIGIN = "https://life-os-5qd.pages.dev"

# Access-token cache + transient OAuth state. Create with:
#   wrangler kv namespace create TOKENS
# then paste the returned id below.
[[kv_namespaces]]
binding = "TOKENS"
id = "4a74d2527203487fbca725ce83b0a159"

# Daily reminders. Cloudflare crons are UTC; the handler computes the real
# Europe/Warsaw hour to honour the 21:00 habit nudge across DST.
# Secrets not listed here are set via `wrangler secret put` and locally in .dev.vars.
# GEMINI_API_KEY — Google AI Studio key (https://aistudio.google.com/app/apikey)
#   Required for /api/meal-plan and /api/wardrobe/suggestion endpoints.
#   To set in production: npx wrangler secret put GEMINI_API_KEY

[triggers]
crons = ["0 6 * * *", "0 7 * * *", "0 8 * * *", "0 19 * * *", "0 20 * * *"]
